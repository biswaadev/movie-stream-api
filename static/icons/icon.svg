      <stop offset="0%" stop-color="#1a1d27" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a26" />
      <stop offset="100%" stop-color="#b80610" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#e50914" stroke-width="12" />
  <!-- Red Inner Shield -->
  <rect x="90" y="90" width="332" height="332" rx="72" fill="url(#redGrad)" />
  <!-- Play Icon -->
