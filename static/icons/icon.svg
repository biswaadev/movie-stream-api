  <!-- OFC Brand Label -->
  <text x="256" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">OFC MOVIES</text>
