<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OFC Movies — Stream & Download HD Movies & Series</title>
<meta name="description" content="Watch and download the latest HD movies, series, and anime with ultra-fast streaming." />
<meta name="theme-color" content="#e50914" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OFC Movies" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f14;
    --surface: #171a22;
    --surface2: #222631;
    --accent: #e50914;
    --accent-hover: #f40612;
    --text: #f5f5f7;
    --muted: #9aa0ad;
    --radius: 12px;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  *::-webkit-scrollbar,
  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  /* Header */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 18px;
  }
  .logo {
    font-weight: 800; font-size: 20px; letter-spacing: -0.5px;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text); }
  .search-wrap {
    flex: 1; max-width: 640px; display: flex; gap: 10px; align-items: center;
  }
  #searchInput {
    flex: 1; min-width: 0;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  #searchInput:focus { border-color: var(--accent); }
  .filter {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #searchBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  #searchBtn:hover { background: var(--accent-hover); }
  /* Main */
  main { padding: 28px 24px 60px; }
  .section-title {
    font-size: 22px; font-weight: 700; margin-bottom: 18px;
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s, box-shadow .18s, border-color .18s;
    border: 1px solid rgba(255,255,255,0.07);
    display: flex; flex-direction: row;
    align-items: stretch;
    min-height: 165px;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.5); border-color: rgba(229,9,20,0.5); }
  .card .poster {
    width: 120px; min-width: 120px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card .poster img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .card .poster .placeholder {
    font-size: 36px; opacity: 0.35;
  }
  .card .poster .dub-badge {
    position: absolute; bottom: 6px; left: 6px;
    background: rgba(0,0,0,0.85); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 5;
  }
  .card .poster .cam-badge {
    position: absolute; top: 6px; left: 6px;
    background: #e50914; color: #fff;
    font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    z-index: 5;
  }
  .card .type-badge {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.85); color: #e50914;
    font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase;
    border: 1px solid rgba(229,9,20,0.4);
    z-index: 5;
  }
  .card .info {
    padding: 14px 18px; flex: 1;
    display: flex; flex-direction: column; justify-content: flex-start;
    gap: 6px; overflow: hidden;
  }
  .card .row-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .card .title {
    font-size: 17px; font-weight: 700; color: #fff;
    white-space: normal; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .card .watch-btn {
    background: #e50914; color: #fff; border: none;
    border-radius: 6px; padding: 5px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; flex-shrink: 0; transition: background .15s;
    box-shadow: 0 2px 8px rgba(229,9,20,0.4);
  }
  .card .watch-btn:hover { background: #f40612; }
  .card .meta-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 2px;
  }
  .card .meta-item { display: inline-flex; align-items: center; gap: 4px; }
  .card .rating-badge {
    background: rgba(245, 197, 24, 0.15); color: #f5c518;
    font-weight: 700; font-size: 11px;
    padding: 2px 7px; border-radius: 4px;
    border: 1px solid rgba(245, 197, 24, 0.3);
  }
  .card .res-badge {
    background: rgba(30, 144, 255, 0.15); color: #1e90ff;
    font-weight: 700; font-size: 11px;
    padding: 2px 7px; border-radius: 4px;
    border: 1px solid rgba(30, 144, 255, 0.3);
  }
  .card .content-rating-badge {
    background: rgba(255, 255, 255, 0.08); color: #ddd;
    font-weight: 600; font-size: 11px;
    padding: 2px 7px; border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .card .genre-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .card .genre-chip {
    background: rgba(255,255,255,0.06); color: #bbb;
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
  }
  .card .desc {
    font-size: 13px; color: #bbb; line-height: 1.45; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis;
  }
  .card .desc:empty {
    display: none;
  }
  /* States */
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .loading .spinner {
    width: 38px; height: 38px; margin: 0 auto 14px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #ff6b6b; }

  /* Continue Watching */
  .cw-card {
    position: relative;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
  }
  .cw-card:hover {
    transform: translateY(-3px);
    border-color: rgba(229,9,20,0.5);
  }
  .cw-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #181818;
  }
  .cw-thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .cw-progress-bg {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.3);
  }
  .cw-progress-fill {
    height: 100%; background: #e50914; width: 0%;
  }
  .cw-info {
    padding: 8px 10px;
  }
  .cw-title {
    font-size: 13px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cw-sub {
    font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; justify-content: space-between;
  }

  /* Quick Category Pills */
  .category-pills {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 0 14px 0;
    margin-bottom: 22px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    will-change: scroll-position;
    transform: translateZ(0);
  }
  .category-pills::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .cat-pill:hover {
    background: var(--surface2);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }
  .cat-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 3px 12px rgba(229,9,20,0.4);
  }

  /* Home Horizontal Carousels */
  .feed-section {
    margin-bottom: 34px;
  }
  .feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .feed-title {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feed-carousel {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 14px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    will-change: scroll-position;
    transform: translateZ(0);
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  .feed-carousel::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  .carousel-card {
    flex: 0 0 150px;
    width: 150px;
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    contain: layout paint;
    content-visibility: auto;
    contain-intrinsic-size: 150px 300px;
    transform: translateZ(0);
  }
  @media (hover: hover) {
    .carousel-card {
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .carousel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.6);
      border-color: var(--accent);
    }
  }
  .carousel-card .thumb-wrap {
    position: relative;
    width: 100%;
    height: 215px;
    background: var(--surface2);
    overflow: hidden;
  }
  .carousel-card .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .carousel-card .info {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .carousel-card .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .carousel-card .meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .carousel-card .desc {
    font-size: 11px;
    color: #999;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .carousel-card .desc:empty {
    display: none;
  }

  /* Pagination */
  .pager {
    display: flex; justify-content: center; gap: 10px; margin-top: 34px;
  }
  .pager button {
    background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 9px 18px; cursor: pointer; font-size: 14px;
  }
  .pager button:hover { background: var(--accent); border-color: var(--accent); }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 100; display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    width: 100%; max-width: 820px;
    border: 1px solid rgba(255,255,255,0.07);
    overflow: hidden;
    animation: rise .25s ease;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
  .modal-hero {
    display: flex; gap: 22px; padding: 26px;
  }
  .modal-hero .poster {
    width: 220px; flex-shrink: 0;
    border-radius: var(--radius);
    overflow: hidden; background: var(--surface2);
  }
  .modal-hero .poster img { width: 100%; height: auto; display: block; }
  .modal-hero .content { flex: 1; min-width: 0; }
  .modal h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .modal .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .tag {
    background: var(--surface2);
    font-size: 12px; color: var(--muted);
    padding: 4px 10px; border-radius: 999px;
  }
  .modal .desc { font-size: 14px; line-height: 1.6; color: var(--muted); }
  .modal .close {
    float: right; background: none; border: none; color: var(--muted);
    font-size: 26px; cursor: pointer; line-height: 1;
  }
  .modal .close:hover { color: var(--text); }
  .modal-body { padding: 0 26px 26px; }
  .ep-section { margin-top: 18px; }
  .ep-section h3 { font-size: 15px; margin-bottom: 10px; }
  .ep-select {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .ep-btn {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .ep-btn:hover, .ep-btn.active { background: var(--accent); border-color: var(--accent); }
  .play-btn {
    margin-top: 16px;
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    padding: 13px 30px; font-size: 15px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  .play-btn:hover { background: var(--accent-hover); }
  .play-btn:disabled { opacity: 0.5; cursor: wait; }
  .download-btn {
    margin-top: 16px;
    background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 13px 30px; font-size: 15px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    margin-left: 10px;
  }
  .download-btn:hover { background: #2d3342; border-color: var(--accent); color: var(--accent); }
  .download-btn:disabled { opacity: 0.5; cursor: wait; }
  .dub-strip { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
  .dub-chip {
    background: rgba(229,9,20,0.12); color: #ff7a81;
    border: 1px solid rgba(229,9,20,0.35);
    border-radius: 999px; font-size: 12px; font-weight: 600;
    padding: 4px 12px;
  }
  /* Player */
  #playerWrap { margin-top: 18px; display: none; }
  #playerWrap video {
    width: 100%; border-radius: var(--radius);
    background: #000; max-height: 460px;
  }
  .res-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .res-chip {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted); border-radius: 8px; padding: 6px 12px;
    font-size: 12px; cursor: pointer;
  }
  .res-chip.active { color: var(--accent); border-color: var(--accent); }
  .res-chip .dub { color: #7bd88f; margin-left: 6px; }
  .res-chip .size { color: var(--muted); font-size: 11px; margin-left: 6px; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 20px; border-top: 1px solid rgba(255,255,255,0.05);
  }

  /* Mobile Responsiveness */
  @media (max-width: 680px) {
    header {
      padding: 10px 12px;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .logo { text-align: center; }
    .search-wrap {
      width: 100%;
      max-width: 100%;
      flex-wrap: wrap;
      gap: 8px;
    }
    #searchInput {
      flex: 1 1 100%;
      font-size: 14px;
      padding: 10px 12px;
    }
    #typeFilter {
      flex: 1;
      padding: 9px 10px;
    }
    #searchBtn {
      flex: 1;
      padding: 9px 14px;
    }
    main {
      padding: 14px 10px 48px;
    }
    .card {
      min-height: auto;
      border-radius: 10px;
    }
    .card .poster {
      width: 100px;
      min-width: 100px;
    }
    .card .info {
      padding: 10px 12px;
      gap: 4px;
    }
    .card .title {
      font-size: 15px;
      -webkit-line-clamp: 2;
    }
    .card .desc {
      font-size: 12px;
      -webkit-line-clamp: 2;
    }
    #continueWatchingGrid {
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)) !important;
      gap: 10px !important;
    }
  }
  /* Skeleton Loading Styles */
  @keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.03) 75%) !important;
    background-size: 200% 100% !important;
    animation: skeleton-shimmer 1.5s infinite linear !important;
    border-radius: 6px;
    color: transparent !important;
    user-select: none;
    pointer-events: none;
  }
  .skeleton-card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
    display: flex; flex-direction: row;
    align-items: stretch;
    min-height: 165px;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.985); filter: brightness(1.2); }
  }
  .loading-pulse {
    animation: pulseGlow 1.1s infinite ease-in-out !important;
    pointer-events: none !important;
    position: relative;
  }
  .loading-pulse::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(229,9,20,0.12);
    border-radius: inherit;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="topProgressBar" style="position:fixed;top:0;left:0;width:0%;height:3px;background:linear-gradient(90deg, #e50914, #ff3b30, #ff8c00);box-shadow:0 0 12px rgba(229,9,20,0.85), 0 0 4px #ff3b30;z-index:999999;transition:width 0.22s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;pointer-events:none;opacity:0;"></div>

<header>
  <div class="logo" onclick="navigateTo('/', this)">OFC<span>Movies</span></div>
  <div class="search-wrap" style="position:relative;">
    <input id="searchInput" type="text" placeholder="Search movies, series, anime..." autocomplete="off" />
    <div id="suggestBox" class="suggest-box" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,0.6);z-index:200;max-height:300px;overflow-y:auto;padding:6px;"></div>
    <select id="typeFilter" class="filter">
      <option value="0">All</option>
      <option value="1">Movies</option>
      <option value="2">Series</option>
      <option value="5">Anime</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>
  <button id="pwaInstallBtn" onclick="installPWA()" style="display:none;background:rgba(229,9,20,0.15);border:1px solid rgba(229,9,20,0.4);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;align-items:center;gap:6px;white-space:nowrap;transition:background .15s;" onmouseover="this.style.background='rgba(229,9,20,0.3)'" onmouseout="this.style.background='rgba(229,9,20,0.15)'">

<script>
if ('serviceWorker' in navigator) {

let isNavigating = false;
let loadingTimer = null;

function startLoading() {
  const bar = document.getElementById('topProgressBar');
  if (!bar) return;
  clearTimeout(loadingTimer);
  bar.style.opacity = '1';
  bar.style.width = '25%';
  
  loadingTimer = setTimeout(() => {
    bar.style.width = '65%';
    loadingTimer = setTimeout(() => {
      bar.style.width = '85%';
      // Safety auto-finish after 3.5s so it NEVER remains stuck
      loadingTimer = setTimeout(() => {
        finishLoading();
      }, 3500);
    }, 300);
  }, 120);
}

function finishLoading() {
  isNavigating = false;
  clearTimeout(loadingTimer);
  const bar = document.getElementById('topProgressBar');
  if (bar) {
    bar.style.width = '100%';
    setTimeout(() => {
      bar.style.opacity = '0';
      setTimeout(() => { bar.style.width = '0%'; }, 250);

  document.querySelectorAll('.loading-pulse').forEach(el => {
    el.classList.remove('loading-pulse');
    el.style.pointerEvents = '';

}

function navigateTo(url, clickedEl) {
  if (isNavigating) return;
  isNavigating = true;
  if (clickedEl) {

  setTimeout(() => { location.href = url; }, 60);
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(s) {
  if (!isFinite(s) || isNaN(s) || s < 0) return "0:00";
  s = Math.floor(s);
  const hrs = Math.floor(s / 3600);
  const mins = Math.floor((s % 3600) / 60);
  const secs = String(s % 60).padStart(2, "0");
  if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${secs}`;
  return `${mins}:${secs}`;
}

function encodeStreamToken(str) {
  if (!str) return "";
  const salt = "mb_stream_v2_salt_2026";
  let enc = "";
  for (let i = 0; i < str.length; i++) {
    enc += String.fromCharCode(str.charCodeAt(i) ^ salt.charCodeAt(i % salt.length));
  }
  return btoa(enc).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function optimizeImgUrl(url, w = 180, q = 45) {
  if (!url || typeof url !== 'string') return '';
  if (url.startsWith('/img/v/') || url.startsWith('/api/image_proxy')) {
    if (!url.includes('?')) {
      return `${url}?w=${w}&q=${q}`;
    }
    return url;
  }
  if (url.startsWith('/static/')) return url;
  if (!url.startsWith('http://') && !url.startsWith('https://')) return url;
  const token = encodeStreamToken(url);
  if (!token) return '';
  return `/img/v/${token}.webp?w=${w}&q=${q}`;
}

function renderHomeFeed(data) {
  const homeSec = document.getElementById('homeFeedSection');
  if (!homeSec) return;
  const sections = data?.data?.sections || [];
  if (!sections.length) {
    homeSec.innerHTML = '<div class="empty">No content available at the moment.</div>';

  }

  homeSec.innerHTML = sections.map(sec => {
    const title = esc(sec.title || 'Featured');
    const items = (sec.items || []).filter(it => {
      if (it.restrictKid === 1) return false;
      const cr = (it.contentRating || '').toUpperCase();
      if (['R', 'NC-17', '18+', 'TV-MA', 'XXX'].includes(cr)) return false;
      const t = (it.title || '').toLowerCase();
      if (t.includes('18+') || t.includes('erotic') || t.includes('porn') || t.includes('sex')) return false;
      const c = (it.corner || '').toLowerCase();
      if (c.includes('18+') || c.includes('adult')) return false;
      return true;

    const cardsHtml = items.map(it => {

      const rating = it.imdbRatingValue || it.imdbRating || '';
      const cover = it.cover?.url || (Array.isArray(it.cover) ? it.cover[0]?.url : '') || '';

      return `

            <div class="title" title="${t}">${t}</div>
            <div class="meta">
              <span>${year}</span>
              ${rating ? `<span style="color:#f5c518">★ ${rating}</span>` : ''}
            </div>
            <div class="desc" data-card-desc="${id}" title="${esc(rawDesc)}">${esc(rawDesc)}</div>

    return `

  }).join('');
  observeMissingDescriptions();
}

const descCache = new Map();
let descObserver = null;

function observeMissingDescriptions() {
  const missingEls = document.querySelectorAll('[data-card-desc]');
  if (!missingEls.length) return;

  if (!('IntersectionObserver' in window)) {
    Array.from(missingEls).slice(0, 10).forEach(el => {
      const sid = el.getAttribute('data-card-desc');
      if (sid && !el.textContent.trim()) fetchCardDescription(sid, el);
    });
    return;
  }

  if (!descObserver) {
    descObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const el = entry.target;
          obs.unobserve(el);
          const sid = el.getAttribute('data-card-desc');
          if (sid && !el.textContent.trim()) {
            fetchCardDescription(sid, el);
          }
        }
      });
    }, { rootMargin: '250px' });
  }

  missingEls.forEach(el => {
    if (!el.textContent.trim()) {
      descObserver.observe(el);
    }
  });
}

async function fetchCardDescription(sid, el) {
  if (!sid) return;
  if (descCache.has(sid)) {
    const cached = descCache.get(sid);
    if (cached && el && !el.textContent.trim()) {
      el.textContent = cached;
      el.setAttribute('title', cached);
    }
    return;
  }
  try {
    const r = await fetch(`/api/detail/${sid}`);
    const data = await r.json();
    const d = data.data || data;
    const realDesc = (d.description || d.desc || d.introduction || d.summary || '').trim();
    if (realDesc) {
      descCache.set(sid, realDesc);
      if (el && !el.textContent.trim()) {
        el.textContent = realDesc;
        el.setAttribute('title', realDesc);
      }
    }
  } catch (e) {}
}

  const isCam = item.isCam || title.toLowerCase().includes('cam');
  const rating = item.imdbRatingValue || item.imdbRating || item.rating || '';
  const durStr = item.duration || (item.durationSeconds ? (Math.floor(item.durationSeconds/3600) > 0 ? `${Math.floor(item.durationSeconds/3600)}h ${Math.floor((item.durationSeconds%3600)/60)}m` : `${Math.floor(item.durationSeconds/60)} min`) : '');
  const country = item.countryName || '';
  const contentRating = item.contentRating || '';

  // Extract resolutions from resourceDetectors
  let bestRes = '';
  if (item.resourceDetectors && Array.isArray(item.resourceDetectors)) {
    const resNums = item.resourceDetectors.map(r => r.resolution).filter(n => typeof n === 'number' && n > 0);
    if (resNums.length > 0) {
      const maxR = Math.max(...resNums);
      bestRes = maxR >= 2160 ? '4K Ultra HD' : maxR >= 1080 ? '1080p Full HD' : maxR + 'p';
    }
  }

  // Genres
  let genres = [];
  const rawGenres = item.genre || item.genres || item.genreList || item.styleGroupList || [];
  if (Array.isArray(rawGenres)) {
    genres = rawGenres.map(g => typeof g === 'string' ? g : (g.name || g.genreName || g.styleName || '')).filter(Boolean);
  } else if (typeof rawGenres === 'string') {
    genres = rawGenres.split(',').map(s => s.trim()).filter(Boolean);
  }
  genres = genres.slice(0, 5);

  const rawDesc = (item.description || item.desc || item.introduction || item.summary || item.synopsis || '').trim();
  const akaStr = item.aka ? `Also known as: ${item.aka}` : '';
  const desc = rawDesc || akaStr || '';

  let poster = '';
  const cover = item.cover || item.imageList || item.images || item.image || [];
  const rawSrc = (cover && (cover.url || (Array.isArray(cover) && cover[0] && (cover[0].url || cover[0])))) || '';
  const optSrc = optimizeImgUrl(rawSrc, 160, 60);
  if (optSrc) poster = `<img src="${esc(optSrc)}" loading="lazy" alt="${esc(title)}" onerror="this.onerror=null;this.style.opacity=0.35;" />`;

  const starIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="#f5c518" style="vertical-align:-1px;margin-right:3px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
  const micIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:3px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>`;
  const calIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:3px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const clockIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:3px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
  const pinIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:3px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  const playIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:3px"><path d="M8 5v14l11-7z"/></svg>`;
  const filmPlaceholder = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.35"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v7M12 15v7M2 12h7M15 12h7"/></svg>`;

  return `
    <div class="card" onclick="navigateTo('/watch/${id}', this)">
      <div class="poster">
        ${poster || `<div class="placeholder">${filmPlaceholder}</div>`}
        ${type ? `<div class="type-badge">${type}</div>` : ''}
        ${isCam ? `<div class="cam-badge">CAM</div>` : ''}
        ${dub ? `<div class="dub-badge">${micIcon}${esc(dub)}</div>` : ''}
      </div>
      <div class="info">
        <div class="row-top">
          <div class="title">${esc(title)}</div>
          <button class="watch-btn">${playIcon}Watch</button>
        </div>
        <div class="meta-row">
          ${rating ? `<span class="rating-badge">${starIcon}${esc(rating)}</span>` : ''}
          ${bestRes ? `<span class="res-badge">${bestRes}</span>` : ''}
          ${contentRating ? `<span class="content-rating-badge">${esc(contentRating)}</span>` : ''}
          ${year ? `<span class="meta-item">${calIcon}${esc(year)}</span>` : ''}
          ${durStr ? `<span class="meta-item">${clockIcon}${esc(durStr)}</span>` : ''}
          ${country ? `<span class="meta-item">${pinIcon}${esc(country)}</span>` : ''}
        </div>
        ${genres.length ? `<div class="genre-list">${genres.map(g => `<span class="genre-chip">${esc(g)}</span>`).join('')}</div>` : ''}
        <div class="desc" data-card-desc="${id}" title="${esc(desc)}">${esc(desc)}</div>
      </div>
    </div>`;
}

async function doSearch(page, append = false) {
  const sb = document.getElementById('suggestBox');
  if (sb) sb.style.display = 'none';
  if (isLoading) return;
  const q = searchInput.value.trim();
  const type = parseInt(typeFilter.value);
  if (!q) { showWelcome(); return; }
  
  isLoading = true;
  currentPage = page;
  currentQuery = q;
  currentType = type;
  
  if (!append) {
    const homeSec = document.getElementById('homeFeedSection');
    if (homeSec) homeSec.style.display = 'none';
    showLoading();
    hasMore = true;
  } else {
    document.getElementById('scrollLoader').style.display = 'block';
  }
  
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&page=${page}&type=${type}`);
    const data = await r.json();
    if (data.error) { if (!append) showError(data.error); return; }
    const list = data.data?.items || data.data?.list || data.list || data.data?.subjects || [];
    
    if (!append) {
      if (!list || list.length === 0) { showError('No results found. Try a different keyword.'); return; }
      stateEl.innerHTML = `<div class="section-title">Results for "${esc(q)}" ${typeFilter.options[typeFilter.selectedIndex].text}</div>`;
      resultsEl.innerHTML = '<div class="grid" id="resultsGrid"></div>';
    }
    
    const grid = document.getElementById('resultsGrid');
    if (grid) {
      grid.insertAdjacentHTML('beforeend', list.map(cardHTML).join(''));
      observeMissingDescriptions();
    }
    
    hasMore = list.length >= 20;
    document.getElementById('scrollLoader').style.display = 'none';
  } catch (e) { 
    if (!append) showError('Network error: ' + e.message); 
  } finally {
    isLoading = false;
  }
}

searchBtn.addEventListener('click', () => doSearch(1));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Escape') {
    const sb = document.getElementById('suggestBox');
    if (sb) sb.style.display = 'none';
    if (e.key === 'Enter') doSearch(1);
  }
});

// Live Auto-Suggest
const suggestBox = document.getElementById('suggestBox');
let suggestTimer = null;
if (searchInput && suggestBox) {
  searchInput.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    const q = searchInput.value.trim();
    if (!q) { suggestBox.style.display = 'none'; return; }
    
    // Show Suggestion Skeleton while typing
    suggestBox.innerHTML = Array(4).fill(0).map(() => `
      <div style="padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div class="skeleton" style="width:65%;height:14px;border-radius:4px;"></div>
        <div class="skeleton" style="width:36px;height:12px;border-radius:4px;"></div>
      </div>
    `).join('');
    suggestBox.style.display = 'block';

    suggestTimer = setTimeout(async () => {
      try {
        const r = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
        const j = await r.json();
        const items = j.data?.items || j.items || j.data?.list || [];
        if (!items.length) { suggestBox.style.display = 'none'; return; }
        suggestBox.innerHTML = items.slice(0, 8).map(it => {
          const title = it.word || it.title || it.subjectName || (it.subject && it.subject.title) || '';
          if (!title) return '';
          const id = it.subjectId || it.id || (it.subject && it.subject.subjectId);
          const year = it.year || it.releaseYear || (it.subject && it.subject.releaseYear) || '';
          const safeTitle = esc(title).replace(/'/g, "\\'");
          const action = id ? `document.getElementById('suggestBox').style.display='none'; navigateTo('/watch/${id}');` : `document.getElementById('searchInput').value='${safeTitle}'; document.getElementById('suggestBox').style.display='none'; doSearch(1);`;
          return `<div style="padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='none'" onclick="${action}">
            <span style="font-weight:600">${esc(title)}</span>
            <span style="color:var(--muted);font-size:11px">${esc(year)}</span>
          </div>`;
        }).join('');
        suggestBox.style.display = 'block';
      } catch { suggestBox.style.display = 'none'; }
    }, 250);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) suggestBox.style.display = 'none';
  });
  window.addEventListener('scroll', () => { suggestBox.style.display = 'none'; }, { passive: true });
}

// Initial state on page load: show welcome or trending
showWelcome();

// Infinite Scroll logic
window.addEventListener('scroll', () => {
  if (!hasMore || isLoading || !currentQuery) return;
  const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
  if (scrollTop + clientHeight >= scrollHeight - 600) {
    doSearch(currentPage + 1, true);
  }
});
// deep-link: /?q=keyword&open=<subjectId> jumps straight to the detail page
if (location.search.includes('open=')) {
  const m = location.search.match(/[?&]open=([^&]*)/);
  if (m) { location.href = '/watch/' + decodeURIComponent(m[1]); }
} else if (location.search.includes('q=')) {
  const m = location.search.match(/[?&]q=([^&]*)/);
  if (m) { searchInput.value = decodeURIComponent(m[1]); doSearch(1); }
} else { showWelcome(); }

/* ---------------- Detail modal ---------------- */
const backdrop = document.getElementById('modalBackdrop');
const modal = document.getElementById('modal');

function closeModal() { backdrop.classList.remove('open'); }
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

async function openDetail(id) {
  backdrop.classList.add('open');
  modal.innerHTML = '<div class="loading" style="padding:40px"><div class="spinner"></div>Loading details...</div>';
  let detail, seasons, resources;
  try { detail = await (await fetch(`/api/detail/${id}`)).json(); } catch(e) { detail = {error: String(e)}; }
  try { seasons = await (await fetch(`/api/seasons/${id}`)).json(); } catch(e) { seasons = {error: String(e)}; }
  try { resources = await (await fetch(`/api/resources?subjectId=${id}&se=0&ep=0`)).json(); } catch(e) { resources = {error: String(e)}; }
  renderModal(detail, seasons, resources, id);
}

function renderModal(detail, seasons, resources, id) {
  const d = detail?.data || detail || {};
  const title = d.title || d.subjectName || esc(id);
  const cover = d.cover || d.imageList || d.images || {};
  const src = (cover && (cover.url || (Array.isArray(cover) && cover[0] && (cover[0].url || cover[0])))) || '';
  const meta = [d.year, d.releaseYear, d.releaseDate, d.language, d.countryName, d.duration, d.imdbRatingValue && ('IMDb '+d.imdbRatingValue)].filter(Boolean).join(' · ');
  const desc = d.desc || d.introduction || d.description || 'No description available.';

  const dubs = d.dubs || [];
  const dubRow = dubs.length ? `<div class="dub-strip">${dubs.map(x => `<span class="dub-chip">${x.original ? '🌐' : '🎙️'} ${esc(x.lanName)}</span>`).join('')}</div>` : '';
  const isSeries = (d.subjectType === 2) || ((d.subjectType === undefined) && (seasons?.data?.seasons?.length > 0));

  // episode controls
  let epControls = '';
  if (isSeries) {
    const s = (seasons?.data?.seasons || seasons?.data || []).map(x => x || {}).filter(x => (x.maxEp ?? 1) > 0);
    if (s.length) {
      epControls = `
        <div class="ep-section">
          <h3>Seasons & Episodes</h3>
          <div class="ep-select" id="epSelect">
            ${s.map((x, i) => `<button class="ep-btn" onclick="pickEpisode('${id}', ${x.se ?? 0}, ${x.maxEp ?? 1}, '${esc(x.title || x.seasonName || ('S'+(x.se ?? i+1)))}')">S${x.se ?? i+1}</button>`).join('')}
          </div>
        </div>`;
    }
  }

  modal.innerHTML = `
    <div class="modal-hero">
      <button class="close" onclick="closeModal()">×</button>
      ${src ? `<div class="poster"><img src="${esc(src)}" alt="${esc(title)}" onerror="this.style.display='none'"/></div>` : ''}
      <div class="content">
        <h2>${esc(title)}</h2>
        <div class="tags">
          ${meta ? `<span class="tag">${esc(meta)}</span>` : ''}
          ${isSeries ? '<span class="tag">Series</span>' : '<span class="tag">Movie</span>'}
        </div>
        <div class="desc">${esc(desc)}</div>
        ${dubRow}
        ${epControls}
        <button class="play-btn" id="playBtn" onclick="startPlay('${id}')">▶ Play</button>
        <div id="playerWrap"><video id="player" controls></video>
          <div class="res-chips" id="resChips"></div>
        </div>
      </div>
    </div>`;
  window.__detail = { detail: d, resources: resources?.data || resources };
  window.__current = { id, se: 0, ep: 0, isSeries };
}

async function pickEpisode(id, se, maxEp, label) {
  window.__current = { id, se, ep: 0, maxEp, label };
  document.getElementById('epSelect').innerHTML = '';
  const arr = [];
  for (let i = 1; i <= maxEp; i++) arr.push(i);
  document.getElementById('epSelect').innerHTML =
    `<button class="ep-btn" onclick="loadRes('${id}', ${se}, 0, '${esc(label)}')">S${se}</button>` +
    arr.slice(0, 100).map(i => `<button class="ep-btn" onclick="loadRes('${id}', ${se}, ${i}, '${esc(label)} E${i}')">E${i}</button>`).join('');
  loadRes(id, se, 0, label);
}

let currentResUrl = '';
async function loadRes(id, se, ep, label) {
  window.__current = { id, se, ep, label };
  document.getElementById('playerWrap').style.display = 'none';
  const btn = document.getElementById('playBtn');
  btn.disabled = true; btn.textContent = '⏳ Fetching stream...';
  try {
    const r = await fetch(`/api/resources?subjectId=${id}&se=${se}&ep=${ep}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const list = data.data?.list || data.list || [];
    if (!list.length) throw new Error('No streamable resource found.');
    window.__resList = list;
    btn.disabled = false; btn.textContent = '▶ Play';
    startPlay(id, label);
  } catch (e) {
    btn.disabled = false; btn.textContent = '▶ Play';
    alert('Could not fetch stream: ' + e.message);
  }
}

function startPlay(id, label) {
  const res = window.__resList || window.__detail?.resources?.list;
  if (!res || !res.length) {
    loadRes(id, window.__current.se, window.__current.ep || 0, label || '');
    return;
  }
  const wrap = document.getElementById('playerWrap');
  wrap.style.display = 'block';
  window.__resList = res;
  
  let defaultIdx = 0;
  for (let i = 0; i < res.length; i++) {
    if (res[i].codecName === 'h264' || res[i].codecName !== 'hevc') { defaultIdx = i; break; }
  }

  const chips = document.getElementById('resChips');
  chips.innerHTML = res.map((x, i) => {
    const resLabel = x.resolution ? (x.resolution + 'P') : (x.quality || x.name || ('Res '+(i+1)));
    const raw = String(x.title || '');
    const m = raw.match(/\[([^\[\]]+)\]/);
    const codec = x.codecName === 'hevc' ? 'H.265' : x.codecName === 'h264' ? 'H.264' : '';
    const dub = m ? `<span class="dub">${esc(m[1])}</span>` : '';
    const size = x.size ? `<span class="size">· ${humanSize(x.size)}</span>` : '';
    return `<button class="res-chip ${i===defaultIdx?'active':''}" onclick="pickRes(${i})">${esc(resLabel)}${dub}${size}${codec ? ' <span class="size">· '+esc(codec)+'</span>' : ''}</button>`;
  }).join('');
  renderDownloadBtn(res, defaultIdx);
  pickRes(defaultIdx);
}

function pickRes(i) {
  const res = window.__resList[i];
  if (!res) return;
  const url = res.resourceLink || res.url || res.link;
  const player = document.getElementById('player');
  const endpoint = (res.codecName === 'hevc') ? '/stream_transcode' : '/stream';
  player.src = endpoint + '?url=' + encodeURIComponent(url);
  player.play().catch(() => {});
  document.querySelectorAll('.res-chip').forEach((c, idx) => c.classList.toggle('active', idx === i));
  renderDownloadBtn(window.__resList, i);
}

function humanSize(s) {
  const n = parseInt(s, 10);
  if (!n) return '';
  if (n > 1e9) return (n / 1e9).toFixed(2) + ' GB';
  if (n > 1e6) return (n / 1e6).toFixed(0) + ' MB';
  return (n / 1e3).toFixed(0) + ' KB';
}

function renderDownloadBtn(list, i) {
  const x = list[i];
  if (!x) return;
  const url = x.resourceLink || x.url || x.link;
  const title = window.__detail?.detail?.title || window.__detail?.detail?.subjectTitle || 'movie';
  const se = window.__current?.se, ep = window.__current?.ep;
  const epSuffix = window.__current?.isSeries ? ` - S${se+1}E${ep}` : '';
  const safeTitle = encodeURIComponent(title + epSuffix);
  let dl = document.getElementById('dlBtn');
  if (!dl) {
    dl = document.createElement('button');
    dl.id = 'dlBtn'; dl.className = 'download-btn';
    document.getElementById('playBtn').insertAdjacentElement('afterend', dl);
  }
  dl.disabled = false;
  dl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download ' + esc(x.resolution ? (x.resolution+'P') : '') + (x.size ? ` (${humanSize(x.size)})` : '');
  dl.onclick = () => doDownload(url, safeTitle, dl);
}

function doDownload(url, title, dl) {
  dl.disabled = true; dl.textContent = 'Preparing download...';
  const a = document.createElement('a');
  a.href = '/download?url=' + encodeURIComponent(url) + '&title=' + title;
  a.click();
  setTimeout(() => { dl.disabled = false; dl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download'; }, 2000);
}

/* ---------- PWA Service Worker & Install Handler ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
  });
}

let deferredPWAEvent = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPWAEvent = e;
  const btn = document.getElementById('pwaInstallBtn');
  if (btn) btn.style.display = 'inline-flex';
});

function installPWA() {
  if (!deferredPWAEvent) return;
  deferredPWAEvent.prompt();
  deferredPWAEvent.userChoice.then(choice => {
    if (choice.outcome === 'accepted') {
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'none';
    }
    deferredPWAEvent = null;
  });
}
</script>
